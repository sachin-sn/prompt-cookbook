name: Prompt request
description: Suggest a prompt you'd like to see in the cookbook
labels: [prompt-request]
body:
  - type: textarea
    id: task
    attributes:
      label: What task should the prompt do?
      placeholder: e.g. "Turn meeting notes into a list of action items with owners"
    validations:
      required: true
  - type: textarea
    id: good-output
    attributes:
      label: What does a good answer look like?
      description: This becomes the basis for the prompt's evals.
    validations:
      required: true
